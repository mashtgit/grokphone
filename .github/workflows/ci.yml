name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint backend/src/

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          echo "=== Node.js files ==="
          node --check deploy.js
          node --check outbound.js
          node --check backend/src/index.js
          node --check backend/src/app.js
          node --check backend/src/routes/index.js
          node --check backend/src/db/index.js
      - run: |
          echo "=== VoxEngine files (syntax only) ==="
          node --check scenarios/inbound_handler.voxengine.js
          node --check scenarios/outbound_handler.voxengine.js
          node --check modules/grok_integration.voxengine.js

  # ponytail: placeholder until real tests exist
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: echo "No tests yet — ok" && exit 0

  deploy-frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Install & build frontend
        run: |
          cd frontend
          npm ci
          npx opennextjs-cloudflare build
      - name: Deploy to Cloudflare Workers
        run: cd frontend && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
